name: CI Python

# Workflow reutilizable de CI para proyectos Python.
#
# Uso (en el consumidor):
#   jobs:
#     ci-python:
#       uses: ruuuberth/engineering-standards/.github/workflows/ci-python.yml@v1.0.0
#       with:
#         python-version: "3.12"
#         dependency-mode: uv        # uv | pip | requirements | poetry | none
#
# No instala toolchains de otros lenguajes. Cada perfil es independiente:
# ci-python.yml y ci-rust.yml se llaman en jobs distintos del consumidor.

on:
  workflow_call:
    inputs:
      python-version:
        description: "Versión de Python (p. ej. '3.12', o '3.11' para matrices)."
        type: string
        default: "3.12"
      working-directory:
        description: "Directorio del proyecto (para monorepos)."
        type: string
        default: "."
      dependency-mode:
        description: "uv | pip | requirements | poetry | none"
        type: string
        default: uv
      requirements-path:
        description: "Ruta al requirements.txt cuando dependency-mode=requirements."
        type: string
        default: requirements.txt
      pip-extras:
        description: "Extras a instalar con pip/uv (p. ej. 'dev,test')."
        type: string
        default: ""
      ruff-version:
        description: "Versión de Ruff fijada (se instala con uvx, no se usa @latest)."
        type: string
        default: "0.17.4"
      ruff-lint:
        description: "Ejecutar `ruff check`."
        type: boolean
        default: true
      ruff-format:
        description: "Ejecutar `ruff format --check`."
        type: boolean
        default: true
      ruff-config:
        description: "Ruta a un ruff.toml/pyproject.toml del consumidor. Vacío = defaults del proyecto."
        type: string
        default: ""
      pytest:
        description: "Ejecutar pytest cuando existan tests (auto = solo si hay carpeta/ficheros de test)."
        type: string
        default: auto
      pytest-args:
        description: "Argumentos adicionales para pytest."
        type: string
        default: "-v"
      extra-checks:
        description: "Comandos adicionales, uno por línea. Se ejecutan con bash -euo pipefail."
        type: string
        default: ""
      install-system-deps:
        description: "Paquetes apt a instalar antes de las dependencias (separados por espacios)."
        type: string
        default: ""
      runs-on:
        description: "Runner."
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        type: number
        default: 20
    secrets:
      # Opcional: para índices privados. Nunca se imprime.
      PYPI_INDEX_TOKEN:
        description: "Token para un índice privado (opcional)."
        required: false

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ inputs.python-version }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Instalar dependencias del sistema
        if: inputs.install-system-deps != ''
        shell: bash
        env:
          SYSTEM_DEPS: ${{ inputs.install-system-deps }}
        run: |
          set -euo pipefail
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $SYSTEM_DEPS

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Setup uv
        if: inputs.dependency-mode == 'uv'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Instalar dependencias
        shell: bash
        env:
          MODE: ${{ inputs.dependency-mode }}
          REQ: ${{ inputs.requirements-path }}
          EXTRAS: ${{ inputs.pip-extras }}
          # El token se inyecta como variable de entorno, nunca en la línea de comandos.
          UV_INDEX_TOKEN: ${{ secrets.PYPI_INDEX_TOKEN }}
          PIP_INDEX_TOKEN: ${{ secrets.PYPI_INDEX_TOKEN }}
        run: |
          set -euo pipefail
          case "$MODE" in
            uv)
              if [[ -f uv.lock ]]; then
                echo "uv sync --frozen (lockfile presente)"
                if [[ -n "$EXTRAS" ]]; then
                  uv sync --frozen --extra "$EXTRAS"
                else
                  uv sync --frozen
                fi
              elif [[ -f pyproject.toml ]]; then
                echo "uv sync (sin lockfile)"
                uv sync
              else
                echo "::error::dependency-mode=uv pero no hay pyproject.toml ni uv.lock"
                exit 1
              fi
              ;;
            pip)
              if [[ ! -f pyproject.toml ]]; then
                echo "::error::dependency-mode=pip requiere pyproject.toml"
                exit 1
              fi
              python -m pip install --upgrade pip
              if [[ -n "$EXTRAS" ]]; then
                python -m pip install -e ".[$EXTRAS]"
              else
                python -m pip install -e .
              fi
              ;;
            requirements)
              if [[ ! -f "$REQ" ]]; then
                echo "::error::No existe $REQ"
                exit 1
              fi
              python -m pip install --upgrade pip
              python -m pip install -r "$REQ"
              ;;
            poetry)
              python -m pip install poetry
              poetry install --no-interaction
              ;;
            none)
              echo "Sin instalación de dependencias de proyecto (dependency-mode=none)."
              ;;
            *)
              echo "::error::dependency-mode desconocido: $MODE"
              exit 1
              ;;
          esac

      # Ruff se instala con versión fija mediante uvx, sin depender de que el
      # proyecto lo declare ni de una action de terceros adicional.
      - name: Ruff lint
        if: inputs.ruff-lint
        shell: bash
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
          RUFF_CONFIG: ${{ inputs.ruff-config }}
          RUFF_TARGET: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          args=("check")
          if [[ -n "$RUFF_CONFIG" ]]; then
            args+=("--config" "$RUFF_CONFIG")
          fi
          uvx "ruff@$RUFF_VERSION" "${args[@]}" "$RUFF_TARGET"

      - name: Ruff format --check
        if: inputs.ruff-format
        shell: bash
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
          RUFF_CONFIG: ${{ inputs.ruff-config }}
          RUFF_TARGET: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          args=("format" "--check")
          if [[ -n "$RUFF_CONFIG" ]]; then
            args+=("--config" "$RUFF_CONFIG")
          fi
          uvx "ruff@$RUFF_VERSION" "${args[@]}" "$RUFF_TARGET"

      - name: Detectar si hay tests
        id: detect-tests
        shell: bash
        env:
          PYTEST_MODE: ${{ inputs.pytest }}
          RUNNER: ${{ inputs.dependency-mode }}
        run: |
          set -euo pipefail
          if [[ "$PYTEST_MODE" == "false" || "$PYTEST_MODE" == "off" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$PYTEST_MODE" == "true" || "$PYTEST_MODE" == "always" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # auto: solo si existen ficheros/carpetas de test
          if compgen -G "test_*.py" > /dev/null \
             || compgen -G "*_test.py" > /dev/null \
             || [[ -d tests ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No se detectaron tests; se omite pytest."
          fi

      - name: Pytest
        if: steps.detect-tests.outputs.run == 'true'
        shell: bash
        env:
          MODE: ${{ inputs.dependency-mode }}
          PYTEST_ARGS: ${{ inputs.pytest-args }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "uv" ]]; then
            uv run --no-sync pytest $PYTEST_ARGS
          else
            python -m pytest $PYTEST_ARGS
          fi

      - name: Comprobaciones adicionales configurables
        if: inputs.extra-checks != ''
        shell: bash
        env:
          EXTRA_CHECKS: ${{ inputs.extra-checks }}
        run: |
          set -euo pipefail
          # Se ejecuta literalmente como script; el valor lo controla el
          # mantenedor del repo consumidor en su propio workflow, no el PR.
          printf '%s\n' "$EXTRA_CHECKS" | bash -euo pipefail
